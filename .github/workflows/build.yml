name: Build & Push

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    # One tag set per PostgreSQL major and Dockerfile target: 17, 17-postgis, 18, 18-postgis.
    strategy:
      fail-fast: false
      matrix:
        pg: ["17", "18"]
        target: [full, postgis]
        include:
          - target: postgis
            variant: "-postgis"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Every tag but the plain variant one carries the variant as suffix (main-17-postgis, 1.0.0-18, sha-abc1234-17).
          tags: |
            type=raw,value=${{ matrix.pg }}${{ matrix.variant }},suffix=,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
          flavor: |
            latest=false
            suffix=-${{ matrix.pg }}${{ matrix.variant }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          build-args: PG_MAJOR=${{ matrix.pg }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.pg }}-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.pg }}-${{ matrix.target }}
